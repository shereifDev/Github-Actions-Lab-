#workflow name 
name: test app 

#Trigger 
on: 
  push:
    branches:
      - main
      - "release/**"
  pull_request:
     branches:
      - main
      - "release/**"

jobs:
  test1:
    runs-on: ubuntu-latest
    steps:
    
      - name: checkout code 
        uses: actions/checkout@v7.0.1
        
      - name: Make script executable
        run: chmod +x test.sh
        
      - name: run test scirpt 
        run: ./test.sh 
